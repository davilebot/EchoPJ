<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111114">
  <title>Recuperar senha — EchoPJs</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260908-recovery-1">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="forgot-title">
      <div class="auth-brand"><img src="/static/assets/echo-wordmark-light.png" alt="Echo"><span>PJs</span></div>
      <div class="auth-heading">
        <span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>
        <h1 id="forgot-title">Redefina sua senha.</h1>
        <p>Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link seguro.</p>
      </div>
      <form id="forgot-form">
        <label>E-mail
          <input id="forgot-identifier" name="identifier" type="email" autocomplete="email" required autofocus>
        </label>
        <p id="forgot-message" class="auth-message hidden" role="status"></p>
        <button id="forgot-submit" type="submit">Enviar link de recuperação</button>
      </form>
      <p class="auth-footnote">Por segurança, a confirmação é igual mesmo quando o e-mail não possui conta.</p>
      <p><a class="text-link" href="/login">Voltar para o login</a></p>
    </section>
  </main>
  <script src="/static/forgot-password.js?v=20260908-recovery-1"></script>
</body>
</html>
