<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111114">
  <title>Confirmar cadastro — EchoPJs</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260908-signup-1">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="verify-title">
      <div class="auth-brand"><img src="/static/assets/echo-wordmark-light.png" alt="Echo"><span>PJs</span></div>
      <div class="auth-heading">
        <span class="eyebrow">CONFIRMAÇÃO DE E-MAIL</span>
        <h1 id="verify-title">Preparando seu workspace.</h1>
        <p id="verify-description">Validando o link e criando a organização…</p>
      </div>
      <p id="verify-message" class="auth-message hidden" role="status"></p>
      <p class="auth-footnote">Esse link é individual, expira automaticamente e só pode ser usado uma vez.</p>
      <p><a class="text-link" href="/signup">Solicitar um novo cadastro</a></p>
    </section>
  </main>
  <script src="/static/verify-email.js?v=20260908-signup-1"></script>
</body>
</html>
