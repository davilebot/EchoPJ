<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111114">
  <title>Entrar — EchoPJs</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260908-recovery-1">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
      <div class="auth-brand">
        <img src="/static/assets/echo-wordmark-light.png" alt="Echo">
        <span>PJs</span>
      </div>
      <div class="auth-heading">
        <span class="eyebrow">ACESSO SEGURO</span>
        <h1 id="login-title">Entre no seu workspace</h1>
        <p>Entre com sua conta para acessar suas organizações, consultas e equipe.</p>
      </div>
      <form id="login-form">
        <label>E-mail ou usuário
          <input id="login-identifier" name="identifier" type="text" autocomplete="username" required autofocus>
        </label>
        <label>Senha
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="form-meta"><a class="text-link" href="/forgot-password">Esqueci minha senha</a></div>
        <p id="login-message" class="auth-message hidden" role="alert"></p>
        <button id="login-submit" type="submit">Entrar no EchoPJs</button>
      </form>
      <p class="auth-footnote"><span id="signup-prompt" class="hidden">Primeiro acesso? <a class="text-link" href="/signup">Crie sua empresa</a>.</span><span id="invite-prompt">Ainda não tem conta? Peça um convite ao administrador da sua organização.</span><br><a class="text-link" href="/produto">Conheça o produto</a> · <a class="text-link" href="/plans">Ver planos</a> · <a class="text-link" href="/termos">Termos</a> · <a class="text-link" href="/privacidade">Privacidade</a></p>
    </section>
  </main>
  <script src="/static/login.js?v=20260909-resilient-1"></script>
</body>
</html>
