<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#111114">
  <title>Nova senha — EchoPJs</title>
  <link rel="stylesheet" href="/static/auth.css?v=20260908-recovery-1">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="reset-title">
      <div class="auth-brand"><img src="/static/assets/echo-wordmark-light.png" alt="Echo"><span>PJs</span></div>
      <div class="auth-heading">
        <span class="eyebrow">NOVA SENHA</span>
        <h1 id="reset-title">Escolha uma nova senha.</h1>
        <p>Use pelo menos 8 caracteres. Ao concluir, os acessos antigos serão encerrados.</p>
      </div>
      <form id="reset-form">
        <label>Nova senha
          <input id="reset-password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required autofocus>
        </label>
        <label>Confirmar nova senha
          <input id="reset-confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required>
        </label>
        <label class="checkbox-label"><input id="show-reset-password" type="checkbox">Mostrar senha</label>
        <p id="reset-message" class="auth-message hidden" role="alert"></p>
        <button id="reset-submit" type="submit">Salvar nova senha</button>
      </form>
      <p class="auth-footnote">O link funciona uma única vez e expira automaticamente.</p>
      <p><a class="text-link" href="/forgot-password">Solicitar outro link</a></p>
    </section>
  </main>
  <script src="/static/reset-password.js?v=20260908-recovery-1"></script>
</body>
</html>
